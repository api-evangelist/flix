name: Flix
description: >-
  Flix SE is a Munich-based global travel-tech company founded in 2013 that
  operates an asset-light, platform-based long-distance mobility network across
  more than 40 countries and 8,000+ destinations. Under the Flix umbrella it runs
  four consumer brands — FlixBus (green intercity coaches across Europe, North and
  South America, and Asia), FlixTrain (long-distance rail in Germany and Sweden),
  Greyhound (North America), and Kâmil Koç (Turkey) — having carried more than 500
  million travelers. Flix pairs a technology and data-analytics platform with
  partner bus operators who run the physical fleet, selling and servicing trips
  through its consumer apps and website. Flix does not currently publish a public
  developer API or partner developer portal; its public technical surface is
  limited to a coordinated vulnerability-disclosure program (security.txt) and the
  flix-tech open-source GitHub organization. This profile was surfaced as an
  HV Capital portfolio company and enriched by the API Evangelist pipeline.
